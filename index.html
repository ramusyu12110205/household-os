<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家計簿OS</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#68738a;--line:#dfe4ee;--p:#5b45d6;--danger:#b4234d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px 18px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 8px 30px #1822370d}.top,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:25px;margin:0}.muted{color:var(--muted)}.small{font-size:13px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.nav button,button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.nav button{background:#eef1f7;color:var(--text)}.nav button.active,.primary{background:var(--p);color:#fff}.light{background:#eef1f7;color:var(--text);border:1px solid var(--line)}.danger{background:#fff0f3;color:var(--danger);border:1px solid #efb5c6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat,.item{border:1px solid var(--line);border-radius:13px;padding:13px}.stat{background:#fbfcff}.stat b{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:24px}label{display:block;font-weight:800;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd2df;border-radius:10px;background:#fff;color:var(--text);font:inherit}textarea{min-height:100px}.list{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0edff;color:#4b36bd;font-size:12px;font-weight:800}.bar{height:9px;background:#e8ebf2;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--p)}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(440px,100%);text-align:center}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 15px;border-radius:10px;display:none}@media(max-width:700px){.wrap{padding:12px 12px 80px}.grid,.stats{grid-template-columns:1fr}.nav button{flex:1}.top{align-items:flex-start}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="auth" class="auth"><div class="card authbox"><div style="font-size:48px">💰</div><h1>家計簿OS</h1><p class="muted">家計の記録・予算・カード請求・資産を管理</p><button class="primary" style="width:100%" onclick="login()">Googleでログイン</button><p id="authErr" class="small"></p></div></div>
<div id="app" class="wrap" style="display:none"><div class="top"><div><h1>💰 家計簿OS</h1><div id="user" class="muted small"></div></div><button class="light" onclick="logout()">ログアウト</button></div><div class="nav">${['home:🏠 ホーム','input:📝 記録','history:📋 履歴','monthly:📊 月次','cards:💳 カード請求','assets:🏦 資産','settings:⚙ 設定'].map(x=>{let [a,b]=x.split(':');return `<button id="n-${a}" onclick="show('${a}')">${b}</button>`}).join('')}</div><div id="screen"></div></div><div id="toast" class="toast"></div>
<script>
const sb=supabase.createClient('https://txprypfzdsfaupguhybl.supabase.co','sb_publishable_qiCaP0cBNhms5-usSDzKlQ_nywzlU36',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let me,S={};const $=id=>document.getElementById(id),E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),today=()=>{let d=new Date();return d.toISOString().slice(0,10)},YM=()=>today().slice(0,7),Y=v=>Number(v||0).toLocaleString('ja-JP')+'円';
function toast(x){let t=$('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function auth(){ $('auth').style.display='grid';$('app').style.display='none'}async function login(){let r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(r.error)$('authErr').textContent=r.error.message}async function logout(){await sb.auth.signOut()}
async function boot(u){me=u;$('auth').style.display='none';$('app').style.display='block';$('user').textContent=u.email||'';try{await load();show('home')}catch(e){$('screen').innerHTML=`<div class="card">読み込み失敗：${E(e.message)}</div>`}}
async function load(){let id=me.id,[s,p,c,a,cat,b,t,st]=await Promise.all([sb.from('household_summaries').select('*').eq('user_id',id).eq('archived',false).order('name'),sb.from('household_payment_methods').select('*').eq('user_id',id).eq('archived',false).order('name'),sb.from('household_cards').select('*').eq('user_id',id).eq('archived',false).order('name'),sb.from('household_accounts').select('*').eq('user_id',id).eq('archived',false).order('name'),sb.from('household_categories').select('*').eq('user_id',id).eq('archived',false).order('sort_order').order('name'),sb.from('household_budgets').select('*').eq('user_id',id).order('year_month',{ascending:false}),sb.from('household_transactions').select('*').eq('user_id',id).order('transaction_date',{ascending:false}).order('created_at',{ascending:false}),sb.from('household_settings').select('*').eq('user_id',id).maybeSingle()]);for(let r of [s,p,c,a,cat,b,t,st])if(r.error)throw r.error;S={summaries:s.data||[],payments:p.data||[],cards:c.data||[],accounts:a.data||[],categories:cat.data||[],budgets:b.data||[],transactions:t.data||[],settings:st.data||null}}
function show(n){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('n-'+n).classList.add('active');$('screen').innerHTML=({home,input,history,monthly,cards,assets,settings}[n])();if(n==='input')bindInput()}
function home(){let m=S.settings?.target_year_month?.slice(0,7)||YM(),r=S.transactions.filter(t=>String(t.transaction_date).slice(0,7)===m),income=0,expense=0,repay=0;r.forEach(t=>{let p=t.process_type||'normal',a=+t.amount||0;if(p==='income'||p==='borrowing')income+=a;else if(p==='repayment')repay+=a;else if(!['transfer','card_payment'].includes(p))expense+=+(t.actual_payment??a)});return `<div class="card"><div class="between"><div><div class="muted small">対象年月</div><h2>${E(m)}</h2></div><button class="primary" onclick="show('input')">＋ 記録</button></div><div class="stats" style="margin-top:14px"><div class="stat"><b>収入・借入</b><strong>${Y(income)}</strong></div><div class="stat"><b>実支出</b><strong>${Y(expense)}</strong></div><div class="stat"><b>返済</b><strong>${Y(repay)}</strong></div></div><div class="stat" style="margin-top:10px"><b>実収支</b><strong>${Y(income-expense-repay)}</strong></div></div><div class="card"><div class="between"><h3>最近の記録</h3><button class="light" onclick="show('history')">履歴</button></div><div class="list">${r.slice(0,8).map(t=>`<div class="item"><div class="between"><b>${E(t.description)}</b><b>${Y(t.amount)}</b></div><div class="muted small">${E(t.transaction_date)} ・ ${E(t.category_name||'その他')}</div></div>`).join('')||'<div class="item muted">まだ記録がありません。</div>'}</div></div><div class="card"><div class="between"><h3>予算</h3><button class="light" onclick="show('settings')">設定</button></div>${budget(m)}</div>`}
function budget(m){let bs=S.budgets.filter(b=>String(b.year_month).slice(0,7)===m);if(!bs.length)return '<div class="muted small">予算未設定</div>';let sp={};S.transactions.filter(t=>String(t.transaction_date).slice(0,7)===m&&['normal','expense'].includes(t.process_type||'normal')).forEach(t=>sp[t.category_name||'その他']=(sp[t.category_name||'その他']||0)+(+t.actual_payment||0));return bs.map(b=>{let v=sp[b.category_name]||0,p=+b.amount||0;return `<div style="margin:12px 0"><div class="between"><span>${E(b.category_name)}</span><span>${Y(v)} / ${Y(p)}</span></div><div class="bar"><div style="width:${p?Math.min(100,v/p*100):0}%"></div></div></div>`}).join('')}
function input(){return `<div class="card"><h2>📝 家計を記録</h2><p class="muted small">摘要と決済からカテゴリ・処理区分・カード請求を自動判定。</p><div class="grid"><div><label>日付</label><input id="d" type="date" value="${today()}"><label>内容</label><input id="desc" placeholder="例：ロピア"><label>摘要</label><select id="sum"><option value="">選択してください</option>${S.summaries.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('')}</select><label>決済</label><select id="pay"><option value="">選択してください</option>${S.payments.map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('')}</select></div><div><label>金額</label><input id="amt" type="number" min="0"><label>ポイント利用</label><input id="pts" type="number" min="0" value="0"><label>反映先</label><input id="target"><label>メモ</label><input id="memo"></div></div><div id="preview" class="stat" style="margin-top:12px"></div><button class="primary" style="width:100%;margin-top:12px" onclick="saveTx()">この内容で登録</button></div>`}
function bindInput(){['d','sum','pay','amt','pts'].forEach(id=>$(id)?.addEventListener('input',preview));preview()}
function derive(){let s=S.summaries.find(x=>x.id===$('sum')?.value),p=S.payments.find(x=>x.id===$('pay')?.value),c=p?.linked_card_id?S.cards.find(x=>x.id===p.linked_card_id):null,a=+$('amt')?.value||0,pt=+$('pts')?.value||0;let date=$('d')?.value||today();let billing=c?`${date.slice(0,7)}-01`:null;if(c&&+date.slice(8,10)>+c.close_day){let d=new Date(date.slice(0,7)+'-01T00:00:00');d.setMonth(d.getMonth()+(+c.billing_month_after_close||1)+1);billing=d.toISOString().slice(0,7)+'-01'}else if(c){let d=new Date(date.slice(0,7)+'-01T00:00:00');d.setMonth(d.getMonth()+(+c.billing_month_after_close||1));billing=d.toISOString().slice(0,7)+'-01'}return{s,p,c,a,pt,billing,real:Math.max(0,a-pt)}}
function preview(){if(!$('preview'))return;let x=derive();$('preview').innerHTML=`<b>自動判定</b><div class="small">カテゴリ：<b>${E(x.s?.category_name||'—')}</b> ／ 処理：<b>${E(x.s?.process_type||'—')}</b></div><div class="small">請求カード：<b>${E(x.c?.name||'—')}</b> ／ 請求年月：<b>${E(x.billing||'—')}</b></div><div class="small">実決済：<b>${Y(x.real)}</b></div>`}
async function saveTx(){let x=derive(),desc=$('desc').value.trim();if(!x.s||!x.p||!desc||x.a<=0||x.pt<0||x.pt>x.a)return alert('日付・内容・摘要・決済・金額・ポイントを確認してください。');let row={user_id:me.id,transaction_date:$('d').value,description:desc,summary_id:x.s.id,summary_name:x.s.name,payment_method_id:x.p.id,payment_method_name:x.p.name,amount:x.a,points_used:x.pt,target_input:$('target').value.trim()||null,memo:$('memo').value.trim()||null,cashflow_type:x.s.cashflow_type||'expense',category_name:x.s.category_name||'その他',process_type:x.s.process_type||'normal',target_auto:x.s.target_name||null,billing_type:x.s.billing_type||null,billing_card_id:x.c?.id||null,billing_card_name:x.c?.name||null,billing_year_month:x.billing};let {error}=await sb.from('household_transactions').insert(row);if(error)return alert('登録失敗：'+error.message);await load();toast('家計を登録しました');show('home')}
function history(){return `<div class="card"><div class="between"><h2>📋 履歴</h2><button class="primary" onclick="show('input')">＋ 記録</button></div><div class="list">${S.transactions.map(t=>`<div class="item"><div class="between"><div><b>${E(t.description)}</b><div class="muted small">${E(t.transaction_date)} ・ ${E(t.category_name||'その他')}</div></div><b>${Y(t.amount)}</b></div><div class="row" style="margin-top:7px"><span class="badge">実決済 ${Y(t.actual_payment)}</span>${t.billing_year_month?`<span class="badge">請求 ${E(String(t.billing_year_month).slice(0,7))}</span>`:''}<button class="danger" style="margin-left:auto" onclick="delTx('${t.id}')">削除</button></div></div>`).join('')||'<div class="item muted">記録なし</div>'}</div></div>`}
async function delTx(id){if(!confirm('この記録を削除しますか？'))return;let {error}=await sb.from('household_transactions').delete().eq('id',id).eq('user_id',me.id);if(error)return alert(error.message);await load();toast('削除しました');show('history')}
function monthly(){let m=S.settings?.target_year_month?.slice(0,7)||YM(),r=S.transactions.filter(t=>String(t.transaction_date).slice(0,7)===m&&['normal','expense'].includes(t.process_type||'normal')),sp={};r.forEach(t=>sp[t.category_name||'その他']=(sp[t.category_name||'その他']||0)+(+t.actual_payment||0));let bs=S.budgets.filter(b=>String(b.year_month).slice(0,7)===m);return `<div class="card"><div class="between"><h2>📊 月次 ${E(m)}</h2><input type="month" value="${E(m)}" onchange="setMonth(this.value)" style="width:145px"></div><div class="stats" style="margin-top:12px"><div class="stat"><b>実支出</b><strong>${Y(Object.values(sp).reduce((a,b)=>a+b,0))}</strong></div><div class="stat"><b>予算</b><strong>${Y(bs.reduce((a,b)=>a+(+b.amount||0),0))}</strong></div><div class="stat"><b>カテゴリ</b><strong>${Object.keys(sp).length}</strong></div></div></div><div class="card"><h3>カテゴリ別</h3><div class="list">${Object.entries(sp).sort((a,b)=>b[1]-a[1]).map(([n,v])=>{let b=bs.find(x=>x.category_name===n),p=+b?.amount||0;return `<div class="item"><div class="between"><b>${E(n)}</b><b>${Y(v)}</b></div><div class="muted small">予算 ${p?Y(p):'—'} ${p?'／差額 '+Y(p-v):''}</div></div>`}).join('')||'<div class="muted">支出なし</div>'}</div></div>`}
async function setMonth(m){let {error}=await sb.from('household_settings').upsert({user_id:me.id,target_year_month:m+'-01'},{onConflict:'user_id'});if(error)return alert(error.message);await load();show('monthly')}
function cards(){let m=S.settings?.target_year_month?.slice(0,7)||YM(),arr=[m],d=new Date(m+'-01T00:00:00');for(let i=0;i<2;i++){d.setMonth(d.getMonth()+1);arr.push(d.toISOString().slice(0,7))}return `<div class="card"><h2>💳 カード請求</h2><p class="muted small">請求年月ごとの実決済額。</p>${arr.map(x=>{let r=S.transactions.filter(t=>String(t.billing_year_month||'').slice(0,7)===x);return `<div class="card"><div class="between"><h3>${x}</h3><b>${Y(r.reduce((a,t)=>a+(+t.actual_payment||0),0))}</b></div>${r.map(t=>`<div class="item"><div class="between"><span>${E(t.description)}</span><b>${Y(t.actual_payment)}</b></div><div class="muted small">${E(t.billing_card_name||'カード')} ・ ${E(t.transaction_date)}</div></div>`).join('')||'<div class="muted small">該当なし</div>'}</div>`}).join('')}</div>`}
function assets(){return `<div class="grid"><div class="card"><h2>🏦 口座・現金</h2><div class="stat"><b>実残高合計</b><strong>${Y(S.accounts.reduce((a,x)=>a+(+(x.actual_balance??x.initial_balance)||0),0))}</strong></div><div class="list" style="margin-top:10px">${S.accounts.map(a=>`<div class="item"><div class="between"><b>${E(a.name)}</b><b>${Y(a.actual_balance??a.initial_balance)}</b></div><div class="muted small">${E(a.account_type)}</div></div>`).join('')||'<div class="muted">口座なし</div>'}</div></div><div class="card"><h2>💳 カード</h2><div class="stat"><b>登録残高合計</b><strong>${Y(S.cards.reduce((a,x)=>a+(+x.actual_balance||0),0))}</strong></div><div class="list" style="margin-top:10px">${S.cards.map(c=>`<div class="item"><div class="between"><b>${E(c.name)}</b><b>${Y(c.actual_balance)}</b></div><div class="muted small">締め${c.close_day}日 / 引落${c.withdrawal_day}日</div></div>`).join('')||'<div class="muted">カードなし</div>'}</div></div></div>`}
function settings(){return `<div class="grid"><div class="card"><h3>摘要マスタ</h3><label>名称</label><input id="sn"><label>カテゴリ</label><input id="sc"><label>処理区分</label><select id="sp"><option>normal</option><option>income</option><option>borrowing</option><option>repayment</option><option>transfer</option><option>card_payment</option></select><button class="primary" style="margin-top:10px" onclick="addSummary()">保存</button></div><div class="card"><h3>決済マスタ</h3><label>名称</label><input id="pn"><label>種別</label><select id="pt"><option>cash</option><option>bank</option><option>wallet</option><option>transit</option><option>card</option><option>other</option></select><label>連携カード</label><select id="pc"><option value="">なし</option>${S.cards.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('')}</select><button class="primary" style="margin-top:10px" onclick="addPayment()">保存</button></div><div class="card"><h3>カードマスタ</h3><label>名称</label><input id="cn"><div class="grid"><div><label>締め日</label><input id="cc" type="number" value="15"></div><div><label>引落日</label><input id="cw" type="number" value="10"></div></div><label>締め日後の請求月加算</label><input id="ca" type="number" value="1"><button class="primary" style="margin-top:10px" onclick="addCard()">保存</button></div><div class="card"><h3>口座マスタ</h3><label>名称</label><input id="an"><label>種別</label><select id="at"><option>bank</option><option>cash</option><option>wallet</option><option>transit</option><option>other</option></select><label>初期残高</label><input id="ai" type="number" value="0"><label>実残高</label><input id="aa" type="number" value="0"><button class="primary" style="margin-top:10px" onclick="addAccount()">保存</button></div><div class="card"><h3>カテゴリ・予算</h3><label>カテゴリ名</label><input id="cat"><button class="light" style="margin-top:8px" onclick="addCategory()">カテゴリ追加</button><label>予算年月</label><input id="bm" type="month" value="${YM()}"><label>予算カテゴリ</label><input id="bc"><label>予算額</label><input id="ba" type="number" value="0"><button class="primary" style="margin-top:8px" onclick="saveBudget()">予算保存</button></div></div><div class="card"><h3>登録済みマスタ</h3><div class="list">${S.summaries.map(x=>`<div class="item">摘要：<b>${E(x.name)}</b> <span class="muted small">${E(x.category_name||'')} / ${E(x.process_type||'')}</span></div>`).join('')}${S.payments.map(x=>`<div class="item">決済：<b>${E(x.name)}</b></div>`).join('')}${S.cards.map(x=>`<div class="item">カード：<b>${E(x.name)}</b></div>`).join('')}${S.accounts.map(x=>`<div class="item">口座：<b>${E(x.name)}</b></div>`).join('')}</div></div>`}
async function addSummary(){let n=$('sn').value.trim(),p=$('sp').value;if(!n)return alert('名称を入力');let cf=p==='income'||p==='borrowing'?'income':p==='repayment'?'repayment':p==='transfer'?'transfer':'expense';let {error}=await sb.from('household_summaries').upsert({user_id:me.id,name:n,category_name:$('sc').value.trim()||'その他',process_type:p,cashflow_type:cf,archived:false},{onConflict:'user_id,name'});if(error)return alert(error.message);await load();toast('摘要を保存');show('settings')}
async function addPayment(){let n=$('pn').value.trim();if(!n)return alert('名称を入力');let {error}=await sb.from('household_payment_methods').upsert({user_id:me.id,name:n,method_type:$('pt').value,linked_card_id:$('pc').value||null,archived:false},{onConflict:'user_id,name'});if(error)return alert(error.message);await load();toast('決済を保存');show('settings')}
async function addCard(){let n=$('cn').value.trim();if(!n)return alert('名称を入力');let {error}=await sb.from('household_cards').upsert({user_id:me.id,name:n,close_day:+$('cc').value||31,withdrawal_day:+$('cw').value||26,billing_month_after_close:+$('ca').value||1,archived:false},{onConflict:'user_id,name'});if(error)return alert(error.message);await load();toast('カードを保存');show('settings')}
async function addAccount(){let n=$('an').value.trim();if(!n)return alert('名称を入力');let {error}=await sb.from('household_accounts').upsert({user_id:me.id,name:n,account_type:$('at').value,initial_balance:+$('ai').value||0,actual_balance:+$('aa').value||0,opening_date:today(),archived:false},{onConflict:'user_id,name'});if(error)return alert(error.message);await load();toast('口座を保存');show('assets')}
async function addCategory(){let n=$('cat').value.trim();if(!n)return alert('カテゴリ名を入力');let {error}=await sb.from('household_categories').upsert({user_id:me.id,name:n,kind:'expense',sort_order:S.categories.length,archived:false},{onConflict:'user_id,name'});if(error)return alert(error.message);await load();toast('カテゴリを保存');show('settings')}
async function saveBudget(){let m=$('bm').value,c=$('bc').value.trim(),a=+$('ba').value||0;if(!m||!c)return alert('年月・カテゴリを確認');let {error}=await sb.from('household_budgets').upsert({user_id:me.id,year_month:m+'-01',category_name:c,amount:a},{onConflict:'user_id,year_month,category_name'});if(error)return alert(error.message);await load();toast('予算を保存');show('settings')}
sb.auth.getSession().then(({data:{session}})=>session?boot(session.user):auth());sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&s)boot(s.user);if(e==='SIGNED_OUT')auth()});
</script></body></html>
